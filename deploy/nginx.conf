# Venolva : un seul domaine. nginx sert l'application web (frontend/dist), relaie /api vers gunicorn
# et sert /media si les photos sont sur le disque (inutile avec un stockage objet).
# Remplace venolva.app par ton domaine ; le certificat HTTPS se crée avec certbot.

server {
    listen 80;
    server_name venolva.app www.venolva.app;
    return 301 https://venolva.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name venolva.app;

    ssl_certificate     /etc/letsencrypt/live/venolva.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venolva.app/privkey.pem;

    client_max_body_size 10m;   # photos d'annonces

    root /var/www/venolva/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /media/ {
        alias /var/www/venolva/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # fichiers générés par Vite : nom avec empreinte, cache longue durée
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # l'application est une page unique : toute autre adresse renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}
